<style>
/* Layout concept: a survey sheet. A schematic map of the two fronts leads every act; ruled option cards, mono stamps, ochre = Western Front, steel blue = Eastern Front. */
:root{
  --paper:#E8EDEF;
  --paper-2:#F5F8F9;

  --bad:#B3322B;
  --meter-bg:#D3DDE3;

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1A22;--paper-2:#152531;--ink:#E6EDF0;--ink-soft:#9DB0BB;--rule:#2A3E4B;
    --accent:#E0B04F;--accent-ink:#1A1204;--front2:#6DB6DB;--sea:#0A141B;--land:#1A2E3B;
    --good:#58B97D;--bad:#E5776F;--meter-bg:#223644;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1A22;--paper-2:#152531;--ink:#E6EDF0;--ink-soft:#9DB0BB;--rule:#2A3E4B;

  --good:#58B97D;--bad:#E5776F;--meter-bg:#223644;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);

  padding-right:max(16px,env(safe-area-inset-right,0px));

.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(2rem,9vw,3.1rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.label{font:500 12px/1.4 var(--f-mono);letter-spacing:.06em;color:var(--ink-soft)}
.soft{color:var(--ink-soft)}
.sheet{
  border:1.5px solid var(--ink);
  background-color:var(--paper-2);
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:28px 28px;
  padding:20px 18px 18px;
  display:flex;flex-direction:column;gap:12px;
}
.card{background:var(--paper-2);border:1.5px solid var(--rule);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.ink{border-color:var(--ink)}
/* map */
.mapbox{border:1.5px solid var(--ink);background:var(--sea);line-height:0}
.map{display:block;width:100%;height:auto;max-height:360px}
.map .sea{fill:var(--sea)}
.map .land{fill:var(--land);stroke:var(--ink-soft);stroke-width:1;vector-effect:non-scaling-stroke}
.map .grat{stroke:var(--rule);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.7}
.map text{font-family:var(--f-body);font-size:var(--fs);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;fill:var(--ink);line-height:1}
.map text.cl{fill:var(--ink-soft);text-anchor:middle;font-weight:500}
.map text.cl.post{fill:var(--ink);font-weight:600}
.map text.gt{font-family:var(--f-mono);fill:var(--ink-soft);stroke:none;font-size:calc(var(--fs) * .8)}
.fl{fill:none;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0;vector-effect:non-scaling-stroke}
.fl.fw{stroke:var(--accent)}
.fl.fe{stroke:var(--front2)}
.fl.dim{opacity:.3}
.fl.anim{animation:draw 1.5s ease-out}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.dot{stroke:var(--land);stroke-width:2px;vector-effect:non-scaling-stroke}
.dot.w{fill:var(--accent)}
.dot.e{fill:var(--front2)}
.dot.hit{fill:var(--ink);stroke:var(--land)}
.dot.match{fill:var(--ink)}
.dot.miss{fill:var(--land);stroke:var(--ink);stroke-width:2.5px}
.mk{cursor:pointer}
.mk .ring{fill:none;stroke:var(--ink);stroke-width:2px;vector-effect:non-scaling-stroke}
.hitarea{fill:transparent}
.pulse{fill:none;stroke:var(--ink);stroke-width:2px;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:1}to{transform:scale(2.2);opacity:0}}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-soft)}

.sw{display:inline-block;width:20px;height:4px}
.sw.w{background:var(--accent)}
.sw.e{background:var(--front2)}
.sw.d{width:10px;height:10px;border-radius:50%;background:var(--ink)}
.sw.o{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{

.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.acts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.acts li{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--rule)}
.acts li:last-child{border-bottom:1px solid var(--rule)}
.acts .y{font:500 13px/1.5 var(--f-mono);padding-top:3px}
.acts b{font-family:var(--f-display);font-weight:700;display:block}
dl.legend{margin:0;display:flex;flex-direction:column;gap:8px}
dl.legend div{display:grid;grid-template-columns:140px 1fr;gap:12px}
dl.legend dt{font-weight:600}
dl.legend dd{margin:0;color:var(--ink-soft)}
@media (max-width:420px){
  dl.legend div{grid-template-columns:1fr;gap:0}
}
.btn{
  appearance:none;border:0;cursor:pointer;font:600 16px/1.3 var(--f-body);
  padding:15px 20px;background:var(--accent);color:var(--accent-ink);width:100%;
  border-radius:4px;
}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:hover{filter:brightness(1.06)}
.btn:focus-visible,.opt:focus-visible,summary:focus-visible,.tab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.mk:focus-visible{outline:none}
.mk:focus-visible .ring{stroke-width:4px}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.m-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:500}
.m-top b{font:500 13px/1.6 var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--meter-bg);margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.progress{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  appearance:none;text-align:left;cursor:pointer;color:var(--ink);
  background:var(--paper-2);border:1.5px solid var(--rule);border-radius:4px;
  padding:14px 16px;display:grid;grid-template-columns:30px 1fr;gap:12px;font:inherit;min-height:60px;
}
.opt:hover{border-color:var(--ink)}
.opt .k{font:700 1.15rem/1.3 var(--f-display);color:var(--ink-soft)}
.opt strong{display:block;font-weight:600}
.opt span.d{display:block;color:var(--ink-soft);font-size:14.5px;line-height:1.5;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 13px/1.2 var(--f-mono);padding:6px 9px;border:1.5px solid currentColor;white-space:nowrap}
.chip.up{color:var(--good)}
.chip.down{color:var(--bad)}
.tag{display:inline-block;font:500 12px/1.3 var(--f-mono);padding:4px 8px;border:1.5px solid var(--ink);align-self:flex-start}
.tag.match{background:var(--ink);color:var(--paper)}
.verdict{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,7vw,2.1rem);line-height:1.15}
details{border-top:1px solid var(--rule);padding:10px 0}
details:last-of-type{border-bottom:1px solid var(--rule)}
summary{cursor:pointer;font-weight:600;list-style-position:inside}
details ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.fine{font-size:13.5px;line-height:1.55;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){
  .fl.anim{animation:none}
  .pulse{animation:none;opacity:.6}
  .bar i{transition:none}
}
</style>

/* ---------- map ---------- */
function inView(x, y, v){
  return x > v[0] - 10 && x < v[0] + v[2] + 10 && y > v[1] - 10 && y < v[1] + v[3] + 10;
}
function mapSVG(o){
  o = o || {};
  var v = VB[o.view || "full"], unit = v[2] / 400, fs = 11.5 * unit;
  var s = '<svg class="map" viewBox="'+v.join(" ")+'" role="img" aria-label="Եվրոպայի սխեմատիկ քարտեզ" style="--fs:'+fs.toFixed(2)+'px">';
  s += '<rect class="sea" x="0" y="0" width="720" height="500"></rect>';
  s += '<polygon class="land" points="'+pts(LAND)+'"></polygon>';
  s += '<polygon class="sea" points="'+pts(ADRIA)+'"></polygon>';
  [0,10,20,30,40].forEach(function(lon){
    var x = P(lon,50)[0];
    s += '<line class="grat" x1="'+x+'" y1="0" x2="'+x+'" y2="500"></line>';
    if(o.view === "full" || !o.view){ s += '<text class="gt" x="'+(x+3)+'" y="'+(496)+'">'+lon+'°</text>'; }
  });
  [45,50,55,60].forEach(function(lat){
    var y = P(0,lat)[1];
    s += '<line class="grat" x1="0" y1="'+y+'" x2="720" y2="'+y+'"></line>';
    if(o.view === "full" || !o.view){ s += '<text class="gt" x="4" y="'+(y-4)+'">'+lat+'°</text>'; }
  });
  if(o.year){
    var F = FRONTS[o.year], an = o.anim ? " anim" : "";
    var dw = o.focus === "east" ? " dim" : "", de = o.focus === "west" ? " dim" : "";
    s += '<polyline class="fl fw'+dw+an+'" pathLength="1" points="'+pts(F.w)+'"></polyline>';
    s += '<polyline class="fl fe'+de+an+'" pathLength="1" points="'+pts(F.e)+'"></polyline>';
  }
  if(o.labels){
    (o.labels === "post" ? COUNTRIES_POST : COUNTRIES_PRE).forEach(function(c){
      var q = P(c.lon, c.lat);
      if(inView(q[0], q[1], v)){
        s += '<text class="cl'+(o.labels === "post" ? " post" : "")+'" x="'+q[0].toFixed(1)+'" y="'+q[1].toFixed(1)+'">'+c.n+'</text>';
      }
    });
  }
  if(o.marks){
    MARKS.forEach(function(m, i){
      var q = P(m.lon, m.lat);
      if(!inView(q[0], q[1], v)) return;
      var sel = o.sel === i;
      s += '<g class="mk" tabindex="0" role="button" aria-label="'+m.n+'" data-act="mk" data-v="'+i+'">'+
        '<circle class="hitarea" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="'+(16*unit).toFixed(1)+'"></circle>'+
        '<circle class="dot '+m.f+'" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="'+((sel?7:5)*unit).toFixed(1)+'"></circle>'+
        (sel ? '<circle class="ring" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="'+(11*unit).toFixed(1)+'"></circle>' : '')+
        '<text x="'+(q[0]+m.lab[0]*unit).toFixed(1)+'" y="'+(q[1]+m.lab[1]*unit).toFixed(1)+'" text-anchor="'+m.lab[2]+'">'+m.n+'</text></g>';
    });
  }
  if(o.hi){
    var h = o.hi, hq = P(h.lon, h.lat);
    s += '<circle class="pulse" cx="'+hq[0].toFixed(1)+'" cy="'+hq[1].toFixed(1)+'" r="'+(9*unit).toFixed(1)+'"></circle>';
    s += '<circle class="dot hit" cx="'+hq[0].toFixed(1)+'" cy="'+hq[1].toFixed(1)+'" r="'+(5.5*unit).toFixed(1)+'"></circle>';
    s += '<text x="'+(hq[0]+h.lab[0]*unit).toFixed(1)+'" y="'+(hq[1]+h.lab[1]*unit).toFixed(1)+'" text-anchor="'+h.lab[2]+'" style="font-weight:600">'+h.name+'</text>';
  }
  if(o.results){
    o.results.forEach(function(r){
      var rq = P(r.loc.lon, r.loc.lat);
      s += '<circle class="dot '+(r.match ? "match" : "miss")+'" cx="'+rq[0].toFixed(1)+'" cy="'+rq[1].toFixed(1)+'" r="'+(6*unit).toFixed(1)+'"></circle>';
      s += '<text x="'+(rq[0]+r.loc.lab[0]*unit).toFixed(1)+'" y="'+(rq[1]+r.loc.lab[1]*unit).toFixed(1)+'" text-anchor="'+r.loc.lab[2]+'">'+r.loc.name+'</text>';
    });
  }
  return s + '</svg>';
}
function mapBox(o){ return '<div class="mapbox">'+mapSVG(o)+'</div>'; }
function frontLegend(extra){
  return '<div class="legend-row"><span class="lg"><i class="sw w"></i>Արևմտյան ճակատ</span><span class="lg"><i class="sw e"></i>Արևելյան ճակատ</span>'+(extra||"")+'</div>'+
    '<p class="fine">Սխեմատիկ քարտեզ. ճակատի գծերը և սահմանները մոտավոր են։</p>';
}

function fresh(){
  return {screen:"start", act:0, dec:0, m:zero(), prev:zero(), picked:null, history:[], actAvg:[], mapY:1914, post:false, sel:null, anim:true};
}
function zero(){ return {s:50,j:50,p:50,c:50}; }
function clamp(v){ return Math.max(0, Math.min(100, v)); }
function avg(m){ return Math.round((m.s+m.j+m.p+m.c)/4); }
function curAct(){ return ACTS[S.act]; }
function cur(){ return ACTS[S.act].decisions[S.dec]; }

function meters(from, to){
  return '<div class="meters">' + METERS.map(function(x){
    return '<div class="m"><div class="m-top"><span>'+x.n+'</span><b>'+to[x.k]+'</b></div>'+
           '<div class="bar"><i style="width:'+from[x.k]+'%" data-to="'+to[x.k]+'"></i></div></div>';
  }).join("") + '</div>';
}
function verdictOf(a){
  if(a >= 62) return "Կայուն խաղաղություն";
  if(a >= 50) return "Փխրուն համաձայնություն";
  return "Հաջորդ պատերազմի սերմեր";
}
function overallTitle(a){
  if(a >= 62) return "Խաղաղության ճարտարապետ";
  if(a >= 50) return "Զգույշ դիվանագետ";
  return "Քարտեզի վրա շտապող ձեռք";
}
function extremes(m){
  var hi = METERS[0], lo = METERS[0];
  METERS.forEach(function(x){
    if(m[x.k] > m[hi.k]) hi = x;
    if(m[x.k] < m[lo.k]) lo = x;
  });
  return {hi:hi, lo:lo};
}

  return '<div class="sheet"><div class="label">Արդյունք</div>'+
      '<div class="verdict">'+overallTitle(v)+'</div>'+
      '<p>Երեք մասերի միջին ցուցանիշը՝ <b>'+v+'</b> / 100։ Քո ընտրությունները համընկան պատմության հետ <b>'+matches+'</b> դեպքում '+TOTAL+'-ից։</p></div>'+
    '<div><h3>Քո որոշումները քարտեզի վրա</h3></div>'+
    mapBox({view:"full", labels:"post", results:results})+
    '<div class="legend-row"><span class="lg"><i class="sw d"></i>Համընկնում է պատմության հետ</span><span class="lg"><i class="sw o"></i>Տարբերվում է</span></div>'+
    '<div class="card"><h3>Մասերի համեմատություն</h3>'+
      ACTS.map(function(a,i){
        return '<div><div class="m-top"><span>'+a.name+'</span><b>'+S.actAvg[i]+'</b></div><div class="bar"><i style="width:0" data-to="'+S.actAvg[i]+'"></i></div></div>';
      }).join("")+'</div>'+
    '<div>'+recap+'</div>'+
    '<div class="card"><span class="label">Եզրակացություն</span><p>Պատմաբանների շատ մեկնաբանություններում ամենադիմացկուն կարգավորումներն այն էին, որոնք միաժամանակ հաշվի էին առնում անվտանգությունը, պարտվածի ներառումը համակարգում և տնտեսական վերականգնումը։ Մեկ գործոնի վրա կառուցված խաղաղությունները հաճախ կարճ տևեցին։</p></div>'+
    '<button class="btn" data-act="restart">Խաղալ նորից</button>';
}

/* ---------- render ---------- */
function render(keepScroll){
  var html = "";
  switch(S.screen){
    case "start": html = screenStart(); break;
    case "map": html = screenMap(); break;
    case "actIntro": html = screenActIntro(); break;
    case "decision": html = screenDecision(); break;
    case "outcome": html = screenOutcome(); break;
    case "actEnd": html = screenActEnd(); break;
    case "final": html = screenFinal(); break;
  }
  app.innerHTML = html;
  if(!keepScroll){ window.scrollTo(0, 0); }
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      var bars = app.querySelectorAll(".bar i");
      for(var i=0;i<bars.length;i++){ bars[i].style.width = bars[i].getAttribute("data-to") + "%"; }
    });
  });
  try{ if(window.claude && window.claude.hot && window.claude.hot.snapshot){ window.claude.hot.snapshot(function(){ return {S:S}; }); } }catch(e){}
}

function act(name, v){
  var keep = false;
  S.anim = true;
  if(name === "begin-act"){ S.act = 0; S.history = []; S.actAvg = []; S.screen = "actIntro"; }
  else if(name === "open-map"){ S.screen = "map"; S.sel = null; }
  else if(name === "to-start"){ S.screen = "start"; }
  else if(name === "yr"){ S.mapY = parseInt(v, 10); S.sel = null; keep = true; }
  else if(name === "post"){ S.post = !S.post; S.anim = false; keep = true; }
  else if(name === "mk"){ var i = parseInt(v, 10); S.sel = (S.sel === i) ? null : i; S.anim = false; keep = true; }
  else if(name === "begin-dec"){ S.m = zero(); S.prev = zero(); S.dec = 0; S.screen = "decision"; }
  else if(name === "pick"){
    var idx = parseInt(v, 10), o = cur().options[idx];
    S.prev = {s:S.m.s, j:S.m.j, p:S.m.p, c:S.m.c};
    METERS.forEach(function(x){ S.m[x.k] = clamp(S.m[x.k] + o.fx[x.k]); });
    S.picked = idx;
    S.history.push({act:S.act, dec:S.dec, pick:idx, real:!!o.real});
    S.screen = "outcome";
  }
  else if(name === "next"){
    if(S.dec < curAct().decisions.length - 1){ S.dec += 1; S.screen = "decision"; }
    else { S.actAvg.push(avg(S.m)); S.screen = "actEnd"; }
  }
  else if(name === "next-act"){
    if(S.act < ACTS.length - 1){ S.act += 1; S.screen = "actIntro"; }
    else { S.screen = "final"; }
  }
  else if(name === "restart"){ S = fresh(); }
  render(keep);
}

app.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if(!b) return;
  act(b.getAttribute("data-act"), b.getAttribute("data-v"));
});
app.addEventListener("keydown", function(e){
  if(e.key !== "Enter" && e.key !== " ") return;
  var g = e.target.closest ? e.target.closest(".mk") : null;
  if(!g) return;
  e.preventDefault();
  act("mk", g.getAttribute("data-v"));
});

function start(data){
  try{ if(data && data.S && data.S.m && data.S.screen){ S = data.S; } }catch(e){}
  render(true);
}
if(window.claude && window.claude.hot && window.claude.hot.ready){ window.claude.hot.ready(start); }
else { start((window.claude && window.claude.hot && window.claude.hot.data) || {}); }
</script>
